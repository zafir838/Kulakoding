<!doctype html>
<html>
  <header>
    <h1 class="headline">🎮 Kaza Game Studio</h1>
    <p>Studio game kreatif untuk semua</p>
    <link rel="stylesheet" href="style.css" />
  </header>

  <body>
    <section>
      <h2>Selamat Datang di Studio Kami!</h2>
      <p>Kami membuat game sederhana yang seru dan menyenangkan.</p>
    </section>

    <section>
      <h2>🎮 Game Kami</h2>
      <div class="game-headline">
        <h3 id="Head">Game Scratch Saya</h3>
        <p id="ket">Game Scratch akan ditampilkan di sini.</p>
      </div>
      <br />
      <div class="daftar-game" id="daftar-game"></div>
    </section>

    <section>
      <h2>💰 Pesan Game Custom</h2>

      <input type="text" id="paket" placeholder="Basic / Standard / Premium" />

      <button onclick="hitung()">Hitung Harga</button>

      <p id="hasil"></p>
    </section>

    <script>
      function hitung() {
        let paket = document.getElementById("paket").value;
        let harga;
        if (paket == "Basic") {
          harga = 100000;
        } else if (paket == "Standard") {
          harga = 250000;
        } else if (paket == "Premium") {
          harga = 500000;
        } else {
          alert("Paket tidak valid!");
          harga = 0;
        }
        document.getElementById("hasil").innerHTML = "Harga paket: Rp" + harga;
      }

      let daftarGameStudio = [
        {
          nama: "Balloons Pop!",
          gambar: "balloonthumb.png",
          link: "https://scratch.mit.edu/projects/1382996054",
        },
        {
          nama: "Game 2",
          gambar: "contoh.jpeg",
          link: "https://scratch.mit.edu/projects/1382996055",
        },
        {
          nama: "Game 3",
          gambar: "apakek.png",
          link: "https://scratch.mit.edu/projects/1382996056",
        },
      ];

      for (let i = 0; i < daftarGameStudio.length; i++) {
        document.getElementById("daftar-game").innerHTML +=
          "<div class='game-card'>" +
          "<a href='" +
          daftarGameStudio[i].link +
          "' target='_blank'>" +
          "<img src='" +
          daftarGameStudio[i].gambar +
          "' class='game-thumb'>" +
          "</a>" +
          "<h3>🎮 " +
          daftarGameStudio[i].nama +
          "</h3>" +
          "<p>Game dari studio saya</p>" +
          "</div>";
      }
    </script>
  </body>
  <footer>
    <p>© KGStudio</p>
  </footer>
</html>
