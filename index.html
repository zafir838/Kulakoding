<!doctype html>
<html>
  <header>
    <h1>🎮 Kaza Game Studio</h1>
    <p>Studio game kreatif untuk semua</p>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f4f4f4;
        text-align: center;
      }

      header {
        background: #0d0246;
        color: white;
        padding: 25px;
      }

      section {
        padding: 25px;
      }

      .daftar-game {
        background: white;
        max-width: 500px;
        margin: auto;
        padding: 30px;
        border-radius: 15px;
      }

      button {
        padding: 10px 18px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      .game-card {
        background-color: white;
        padding: 20px;
        margin: 12px auto;
        max-width: 450px;
        border-radius: 12px;
      }
    </style>
  </header>

  <body>
    <section>
      <h2>Selamat Datang di Studio Kami!</h2>
      <p>Kami membuat game sederhana yang seru dan menyenangkan.</p>
    </section>

    <section>
      <h2>🎮 Game Kami</h2>
      <div class="daftar-game" id="daftar-game">
        <h3>Game Scratch Saya</h3>
        <p>Game Scratch akan ditampilkan di sini.</p>
      </div>
    </section>

    <section>
      <h2>💰 Pesan Game Custom</h2>

      <input type="text" id="paket" placeholder="Basic / Standard / Premium" />

      <button onclick="hitung()">Hitung Harga</button>

      <p id="hasil"></p>
    </section>

    <script>
      function hitung() {
        let paket = document.getElementById("paket").value;
        let harga;
        if (paket == "Basic") {
          harga = 100000;
        } else if (paket == "Standard") {
          harga = 250000;
        } else if (paket == "Premium") {
          harga = 500000;
        } else {
          alert("Paket tidak valid!");
          harga = 0;
        }
        document.getElementById("hasil").innerHTML = "Harga paket: Rp" + harga;
      }

      let namaGame = ["Game 1", "Game 2", "Game 3", "Game 4", "Game 5"];

      for (let i = 0; i < namaGame.length; i++) {
        document.getElementById("daftar-game").innerHTML +=
          "<div class='game-card'>" +
          "<h3>🎮 " +
          namaGame[i] +
          "</h3>" +
          "<p>Game dari studio saya</p>" +
          "</div>";
      }
    </script>
  </body>
  <footer>
    <p>© KGStudio</p>
  </footer>
</html>
